<title>Управление Общежитием v6.0</title>
<style>
:root{--bg:#F5F6FA;--surface:#fff;--surface-alt:#F8F9FC;--line:#E4E9F0;--line-soft:#EEF2F7;--ink:#1F2937;--ink-soft:#6B7787;--ink-faint:#9AA6B6;--accent:#3366D6;--accent-fg:#fff;--accent-light:#EAF0FD;--green:#2F9E6B;--green-bg:#EDF9F2;--yellow:#C98A16;--yellow-bg:#FFF7E0;--red:#D94B4B;--red-bg:#FEF1F1;--shadow-sm:0 1px 2px rgba(20,30,50,.05);--shadow-md:0 8px 24px rgba(20,30,50,.10);--radius:14px;--ease:cubic-bezier(.4,0,.2,1)}
html[data-theme=dark]{--bg:#171C27;--surface:#222A38;--surface-alt:#1D2431;--line:#36405280;--line-soft:#2C3545;--ink:#E8EDF4;--ink-soft:#9DAABB;--ink-faint:#6F7C8F;--accent:#6D96F2;--accent-fg:#0F1626;--accent-light:#20304F;--green:#5FCB98;--green-bg:#1B3529;--yellow:#F0B454;--yellow-bg:#3E3017;--red:#F08585;--red-bg:#442424}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 90px;transition:background .3s var(--ease),color .3s var(--ease);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
button,input,select{font-family:inherit}
.icon{width:16px;height:16px;vertical-align:-3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.filetitle{display:flex;align-items:center;gap:12px}
.icon-sheet{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2a4fa8);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.filetitle h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.subtitle{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.theme-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.theme-btn:hover{border-color:var(--accent);background:var(--surface-alt)}
.lang-switch{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.lang-btn{width:34px;height:32px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:15px;opacity:.5;transition:all .2s var(--ease)}
.lang-btn:hover{opacity:.9}
.lang-btn.active{opacity:1;background:var(--accent-light)}
.search-wrap{position:relative;width:220px}
.search-wrap input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 10px 10px 34px;font-size:13.5px;outline:none;color:var(--ink);transition:all .2s var(--ease)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,102,214,.14)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s var(--ease)}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-primary:active{transform:scale(.97)}
.btn-primary.small{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;transition:all .2s var(--ease)}
.btn-secondary:hover{background:var(--surface-alt);border-color:var(--ink-faint)}
.btn-secondary:active{transform:scale(.97)}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .2s var(--ease)}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{width:15px;height:15px}
.tab-panel{animation:fadeIn .3s var(--ease) both}
.notif-banner{display:none;background:var(--yellow-bg);border:1px solid var(--yellow);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;font-size:13.5px;gap:10px}
.notif-header svg{color:var(--yellow)}
.notif-toggle{font-size:12px;color:var(--ink-soft);font-weight:600}
.notif-list{display:flex;flex-direction:column;gap:6px;padding:0 14px 14px}
.notif-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px;font-size:13px;gap:10px;flex-wrap:wrap}
.notif-item-main{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.notif-item-side{display:flex;align-items:center;gap:8px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s var(--ease)}
.filter-chip:hover{border-color:var(--accent);color:var(--ink)}
.filter-chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.chip-icon{width:13px;height:13px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .25s var(--ease);display:flex;align-items:center;gap:12px}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .v{font-size:21px;font-weight:700}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
.stat.red .v{color:var(--red)}.stat.yellow .v{color:var(--yellow)}.stat.green .v{color:var(--green)}
.room-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .25s var(--ease);animation:fadeInUp .35s var(--ease) both}
.room-card:hover{box-shadow:var(--shadow-md)}
.room-card.has-debt{border-left-color:var(--red)}
.room-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface-alt);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.rh-left{display:flex;align-items:center;gap:10px}
.room-num{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.room-badge{font-size:11.5px;background:var(--line-soft);color:var(--ink-soft);padding:3px 9px;border-radius:6px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s var(--ease)}
.room-badge:hover{border-color:var(--accent);color:var(--accent)}
.room-badge.over{background:var(--red-bg);color:var(--red)}
.room-badge.unset{background:transparent;border:1px dashed var(--ink-faint)}
.room-debt{font-size:13px;color:var(--red);font-weight:700;display:flex;align-items:center;gap:5px}
.col-head,.tenant-row{display:grid;grid-template-columns:1.8fr 1fr 1fr 1.2fr 1.2fr 130px;gap:12px;padding:10px 18px;align-items:center}
.col-head{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:700;border-bottom:1px solid var(--line-soft)}
.tenant-row{border-bottom:1px solid var(--line-soft);font-size:13.5px;transition:background .2s var(--ease);cursor:pointer}
.tenant-row:last-child{border-bottom:none}
.tenant-row:hover{background:var(--surface-alt)}
.tr-name{display:flex;align-items:center;gap:10px;min-width:0}
.tr-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0}
.avatar-fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge-red{background:var(--red-bg);color:var(--red)}.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}.badge-green{background:var(--green-bg);color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-red{background:var(--red)}.dot-yellow{background:var(--yellow)}.dot-green{background:var(--green)}
.method-badge{font-size:10.5px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.method-cash{background:var(--green-bg);color:var(--green)}
.method-card{background:var(--accent-light);color:var(--accent)}
.action-btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--ink);font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:all .2s var(--ease)}
.action-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.action-btn:active{transform:scale(.94)}
.action-btn.pay{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.action-btn.danger:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.section-title h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title h2 svg{color:var(--accent)}
.section-hint{margin:-8px 0 14px;font-size:12.5px;color:var(--ink-soft)}
.cash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.cash-balance-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.cash-balance{font-size:28px;font-weight:700}
.cash-balance .label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
.cash-sub-stats{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.cash-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.cash-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface-alt);font-size:13px;gap:10px;border:1px solid var(--line-soft);flex-wrap:wrap}
.cash-type-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cash-type-icon.income{background:var(--green-bg);color:var(--green)}
.cash-type-icon.expense{background:var(--red-bg);color:var(--red)}
.people-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.person-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm);animation:fadeInUp .3s var(--ease) both}
.pc-actions{display:flex;gap:6px}
.pc-main{display:flex;align-items:center;gap:10px;min-width:0}
.person-icon{width:34px;height:34px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.kpi-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-value{font-size:19px;font-weight:700}
.kpi-label{font-size:12px;color:var(--ink-soft);margin-top:2px}
.chart-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.chart-title{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chart-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--ink-soft)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.chart-empty{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:30px 0}
.bank-row{display:grid;grid-template-columns:110px 1fr 100px;align-items:center;gap:10px;font-size:12.5px;margin-bottom:9px}
.bank-bar{height:10px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bank-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s var(--ease)}
.bank-bar i.cash{background:var(--green)}
.rating-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rating-col-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:10px;padding:10px 14px;border-radius:10px}
.rating-col-head.good{background:var(--green-bg);color:var(--green)}
.rating-col-head.bad{background:var(--red-bg);color:var(--red)}
.rating-list{display:flex;flex-direction:column;gap:8px}
.rating-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s var(--ease)}
.rating-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.rating-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;background:var(--surface-alt);color:var(--ink-soft)}
.rating-info{flex:1;min-width:0}
.rating-info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rating-room{font-size:11.5px;color:var(--ink-soft)}
.rating-metric{font-size:12px;font-weight:700;text-align:right}
.statusbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:11px 24px;display:flex;gap:18px;font-size:13px;align-items:center;flex-wrap:wrap;z-index:90;backdrop-filter:blur(8px)}
.statusbar .chip{display:flex;align-items:center;gap:8px}
.statusbar .sep{width:1px;height:16px;background:var(--line)}
#toastContainer{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-md);opacity:0;transform:translateY(10px);transition:all .3s var(--ease)}
.toast.show{opacity:1;transform:none}
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.4);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.overlay.open{opacity:1;pointer-events:auto}
.modal{position:relative;background:var(--surface);border-radius:18px;border:1px solid var(--line);width:100%;max-width:440px;padding:24px;box-shadow:var(--shadow-md);max-height:90vh;overflow-y:auto;transform:scale(.97) translateY(8px);transition:transform .25s var(--ease)}
.overlay.open .modal{transform:none}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:700}
.modal-sub{margin:0 0 18px;font-size:13px;color:var(--ink-soft);line-height:1.4}
.modal-field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:14px}
.modal-field input,.modal-field select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;outline:none;background:var(--bg);color:var(--ink);transition:all .2s var(--ease)}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(51,102,214,.12)}
.modal-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:12px}
.modal-actions button{flex:1;padding:10px;border-radius:9px;font-size:14px;cursor:pointer}
.close-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;transition:color .2s}
.close-x:hover{color:var(--ink)}
.empty-state{text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:13.5px;border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px;padding-right:24px}
.detail-head-info{flex:1;min-width:0}
.detail-head-info h3{margin:0;font-size:17px}
.detail-head-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.detail-phone{font-size:12.5px;color:var(--accent);text-decoration:none;display:inline-block;margin-top:4px}
.detail-notes{font-size:13px;color:var(--ink-soft);background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.detail-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.dstat{background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px}
.dstat .l{font-size:11px;color:var(--ink-faint)}
.dstat .v{font-size:14px;font-weight:700;margin-top:2px}
.detail-finance{background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:4px}
.fin-row{display:flex;justify-content:space-between;font-size:13px}
.fin-row.sub{font-size:12px;color:var(--ink-soft);padding-left:10px}
.fin-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:14px}
.detail-section{margin-bottom:16px}
.detail-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.detail-section-head h4{margin:0;font-size:13.5px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ledger-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto}
.ledger-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:9px;font-size:12.5px;gap:8px;flex-wrap:wrap}
.lr-main{display:flex;align-items:center;gap:8px;min-width:0}
.lr-side{display:flex;align-items:center;gap:6px}
.lr-date{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.ledger-empty{font-size:12.5px;color:var(--ink-faint);padding:10px;text-align:center}
.receipt{font-size:13.5px;line-height:1.7}
.receipt h3{text-align:center;margin-bottom:2px}
.receipt .r-sub{text-align:center;color:var(--ink-soft);font-size:12px;margin-bottom:14px}
.receipt .r-row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0}
.receipt .r-total{font-size:17px;font-weight:700;border-bottom:none;margin-top:6px}

.hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:22px;min-height:300px;display:flex;align-items:flex-end;box-shadow:0 18px 40px -18px rgba(20,30,50,.45);isolation:isolate;animation:fadeInUp .6s var(--ease) both}

.hero:hover .hero-bg{transform:scale(1.0)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(14,20,34,.86) 0%,rgba(14,20,34,.62) 42%,rgba(14,20,34,.12) 100%),linear-gradient(0deg,rgba(14,20,34,.55),transparent 55%)}
.hero-inner{width:100%;padding:34px 36px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero-text{max-width:520px;color:#fff}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.4px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);margin-bottom:14px}
.hero-badge i{width:7px;height:7px;border-radius:50%;background:#F5C84B;box-shadow:0 0 0 4px rgba(245,200,75,.25)}
.hero h2{margin:0 0 10px;font-size:clamp(26px,4.2vw,40px);line-height:1.1;font-weight:750;letter-spacing:-.8px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero h2 em{font-style:normal;color:#F5C84B}
.hero p{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.82);max-width:440px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-cta .btn-primary{background:#F5C84B;color:#2a2108;padding:11px 20px;font-size:14px}
.hero-cta .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s var(--ease)}
.hero-cta .btn-ghost:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-stat{min-width:116px;padding:13px 16px;border-radius:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#fff;transition:transform .25s var(--ease),background .25s var(--ease)}
.hero-stat:hover{transform:translateY(-3px);background:rgba(255,255,255,.2)}
.hero-stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.4px}
.hero-stat span{font-size:11.5px;color:rgba(255,255,255,.75)}
@media (max-width:768px){.hero{min-height:360px;border-radius:20px}.hero-inner{padding:24px 20px}.hero-stat{flex:1;min-width:96px}}

/* ===== v7: стекло, фон, страницы ===== */
:root{--surface:rgba(255,255,255,.62);--surface-alt:rgba(255,255,255,.42);--line:rgba(110,130,175,.26);--line-soft:rgba(110,130,175,.15);
--glass:rgba(255,255,255,.30);--glass-hover:rgba(255,255,255,.55);--glass-border:rgba(110,130,175,.32);--accent-glass:rgba(51,102,214,.13);--accent-glass-h:rgba(51,102,214,.24);
--nav-bg:rgba(246,248,253,.62);--modal-bg:rgba(255,255,255,.90);--dot:rgba(60,80,130,.16);
--bg-base:linear-gradient(135deg,#E8EFFF 0%,#F7F2EA 55%,#E6F5EE 100%);--orb1:#7FA6FF;--orb2:#FFD27F;--orb3:#8FE3C9;--orb-o:.5}
html[data-theme=dark]{--surface:rgba(34,42,60,.55);--surface-alt:rgba(30,38,56,.45);--line:rgba(160,180,220,.18);--line-soft:rgba(160,180,220,.10);
--glass:rgba(255,255,255,.05);--glass-hover:rgba(255,255,255,.12);--glass-border:rgba(190,205,240,.20);--accent-glass:rgba(109,150,242,.16);--accent-glass-h:rgba(109,150,242,.28);
--nav-bg:rgba(15,20,33,.55);--modal-bg:rgba(24,31,46,.92);--dot:rgba(255,255,255,.07);
--bg-base:linear-gradient(135deg,#0A0F1E 0%,#121A2E 55%,#0C1A21 100%);--orb1:#3B5BDB;--orb2:#7048C6;--orb3:#12877F;--orb-o:.38}
body{padding:0 0 90px;background:var(--bg-base)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg-base);pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--orb-o);animation:orbFloat 30s ease-in-out infinite alternate;will-change:transform}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--orb1)}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;top:16vh;background:var(--orb2);animation-delay:-10s}
.bg i:nth-child(3){width:34vmax;height:34vmax;left:30vw;bottom:-16vmax;background:var(--orb3);animation-delay:-18s}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 0%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 25%,#000 0%,transparent 78%)}
@keyframes orbFloat{to{transform:translate3d(5vmax,4vmax,0) scale(1.1)}}
.wrap{max-width:1180px;padding:24px 16px 0}
.topbar{position:sticky;top:0;z-index:80;background:var(--nav-bg);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);border-bottom:1px solid var(--glass-border)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand .subtitle{margin:1px 0 0;font-size:11.5px;white-space:nowrap}
.nav{display:flex;gap:4px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav .tab-btn{border-bottom:none;margin:0;border-radius:11px;padding:8px 14px}
.nav .tab-btn:hover{background:var(--glass)}
.nav .tab-btn.active{background:var(--accent-glass);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-glass-h)}
.top-actions{display:flex;align-items:center;gap:8px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{margin:0;font-size:22px;letter-spacing:-.4px}
.sub-section{margin-top:30px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-soft);font-size:13px}
.mini-row:last-child{border-bottom:none}
.mini-row.click{cursor:pointer;border-radius:10px;transition:background .2s var(--ease)}
.mini-row.click:hover{background:var(--glass)}
.mini-left{display:flex;align-items:center;gap:10px;min-width:0}
/* стеклянные карточки */
.room-card,.stat,.chart-card,.cash-card,.kpi-card,.person-card,.rating-item,.empty-state,.statusbar,.lang-switch,.theme-btn,.filter-chip,.search-wrap input{-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.room-card,.stat,.chart-card,.cash-card,.kpi-card,.person-card,.rating-item{border-color:var(--glass-border);box-shadow:0 10px 30px -18px rgba(30,45,90,.35)}
.room-head{background:var(--surface-alt)}
.modal{background:var(--modal-bg);-webkit-backdrop-filter:blur(26px) saturate(1.25);backdrop-filter:blur(26px) saturate(1.25);border-color:var(--glass-border)}
.overlay{background:rgba(10,15,28,.38)}
.statusbar{background:var(--nav-bg);border-top-color:var(--glass-border)}
/* прозрачные кнопки */
.btn-primary{background:var(--accent-glass);color:var(--accent);border:1px solid var(--accent-glass-h);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-primary:hover{background:var(--accent-glass-h);filter:none;box-shadow:0 8px 22px -12px var(--accent)}
.btn-secondary,.action-btn,.theme-btn,.filter-chip{background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-secondary:hover,.action-btn:hover,.theme-btn:hover,.filter-chip:hover{background:var(--glass-hover);border-color:var(--accent);color:var(--accent)}
.action-btn.pay{background:rgba(47,158,107,.14);border-color:rgba(47,158,107,.5);color:var(--green)}
.action-btn.pay:hover{background:rgba(47,158,107,.26);color:var(--green)}
.action-btn.danger:hover{background:rgba(217,75,75,.14);border-color:var(--red);color:var(--red)}
.filter-chip.active{background:var(--accent-glass);color:var(--accent);border-color:var(--accent-glass-h);box-shadow:inset 0 0 0 1px var(--accent-glass-h)}
.lang-switch{background:var(--glass);border-color:var(--glass-border)}
.lang-btn.active{background:var(--accent-glass)}
.search-wrap input{background:var(--glass)}
.modal-actions .btn-secondary{background:var(--glass)}
.hero{box-shadow:0 24px 50px -24px rgba(20,30,60,.55);border:1px solid rgba(255,255,255,.22)}
.hero-cta .btn-primary{background:rgba(245,200,75,.20);color:#FFE6A3;border:1px solid rgba(245,200,75,.65)}
.hero-cta .btn-primary:hover{background:rgba(245,200,75,.34);box-shadow:0 10px 26px -12px #F5C84B}
.topbar-in{gap:12px}
.nav{justify-content:flex-start;min-width:0}
.nav .tab-btn{padding:8px 11px;gap:5px;font-size:13px}
.brand h1{font-size:15px}
@media (max-width:1240px){.brand .subtitle{display:none}}
@media (max-width:900px){.topbar-in{flex-wrap:wrap;gap:10px}.nav{order:3;flex:1 1 100%;width:100%;justify-content:flex-start}.top-actions{margin-left:auto}.brand .subtitle{display:none}.home-grid{grid-template-columns:1fr}}

/* ===== v8: максимально прозрачное стекло + логотип ===== */
.logo{width:42px;height:42px;flex-shrink:0;filter:drop-shadow(0 8px 16px rgba(38,70,200,.35));transition:transform .35s var(--ease)}
.logo svg{width:100%;height:100%;display:block}
.brand:hover .logo{transform:rotate(-4deg) scale(1.06)}
:root{--surface:rgba(255,255,255,.34);--surface-alt:rgba(255,255,255,.22);--line:rgba(255,255,255,.55);--line-soft:rgba(110,130,175,.14);
--glass:rgba(255,255,255,.16);--glass-hover:rgba(255,255,255,.38);--glass-border:rgba(255,255,255,.65);--nav-bg:rgba(255,255,255,.28);--modal-bg:rgba(255,255,255,.62);
--green-bg:rgba(47,158,107,.15);--yellow-bg:rgba(201,138,22,.16);--red-bg:rgba(217,75,75,.13);--accent-light:rgba(51,102,214,.14);--field:rgba(255,255,255,.38)}
html[data-theme=dark]{--surface:rgba(255,255,255,.055);--surface-alt:rgba(255,255,255,.04);--line:rgba(190,205,240,.16);--line-soft:rgba(190,205,240,.09);
--glass:rgba(255,255,255,.04);--glass-hover:rgba(255,255,255,.12);--glass-border:rgba(190,205,240,.22);--nav-bg:rgba(12,17,30,.42);--modal-bg:rgba(18,25,40,.70);
--green-bg:rgba(95,203,152,.15);--yellow-bg:rgba(240,180,84,.15);--red-bg:rgba(240,133,133,.14);--accent-light:rgba(109,150,242,.16);--field:rgba(255,255,255,.06)}
.room-card,.stat,.chart-card,.cash-card,.kpi-card,.person-card,.rating-item,.empty-state,.statusbar,.lang-switch,.theme-btn,.filter-chip,.search-wrap input,.topbar,.notif-banner{-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
.room-card,.stat,.chart-card,.cash-card,.kpi-card,.person-card,.rating-item{border:1px solid var(--glass-border);border-left-width:1px;box-shadow:0 14px 40px -22px rgba(25,40,90,.40),inset 0 1px 0 rgba(255,255,255,.35)}
html[data-theme=dark] .room-card,html[data-theme=dark] .stat,html[data-theme=dark] .chart-card,html[data-theme=dark] .cash-card,html[data-theme=dark] .kpi-card,html[data-theme=dark] .person-card,html[data-theme=dark] .rating-item{box-shadow:0 14px 40px -22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.room-card.has-debt{box-shadow:inset 4px 0 0 var(--red),0 14px 40px -22px rgba(25,40,90,.40)}
.room-head{background:var(--surface-alt);border-bottom-color:var(--line-soft)}
.modal{background:var(--modal-bg);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);border:1px solid var(--glass-border)}
.modal-field input,.modal-field select{background:var(--field);border-color:var(--glass-border);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
option{background:#fff;color:#1F2937}
html[data-theme=dark] option{background:#1B2335;color:#E8EDF4}
.dstat,.detail-finance,.ledger-row,.cash-item,.notif-item,.detail-notes{background:var(--surface-alt);border-color:var(--line-soft)}
.notif-banner{background:var(--yellow-bg);border-color:rgba(201,138,22,.4)}
.statusbar,.topbar{background:var(--nav-bg)}
.search-wrap input,.lang-switch,.theme-btn{background:var(--glass)}
.badge,.method-badge{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.toast{background:var(--modal-bg);color:var(--ink);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
html[data-theme=dark] .toast{background:var(--modal-bg)}
.btn-secondary,.action-btn,.theme-btn,.filter-chip{background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hero-stat,.hero-badge,.hero-cta .btn-ghost{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tenant-row:hover{background:var(--glass)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

.bg{background:#e9edf3}
html[data-theme=dark] .bg{background:#0b0e14}
.bg i{display:none}
.bg::before{content:"";position:absolute;inset:-4%;background:var(--bgphoto) center/cover no-repeat;filter:saturate(.9)}
.bg::after{content:"";position:absolute;inset:0;background:var(--vig),var(--bgwash);-webkit-mask-image:none;mask-image:none}
.page-banner{position:relative;border-radius:22px;overflow:hidden;min-height:176px;display:flex;align-items:flex-end;margin-bottom:20px;isolation:isolate;border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 44px -24px rgba(15,25,50,.55);animation:fadeInUp .5s var(--ease) both}
.pb-bg{position:absolute;inset:0;background:var(--img) var(--pos,center)/cover no-repeat;transform:scale(1.05);transition:transform 1.4s var(--ease);z-index:-2}
.page-banner:hover .pb-bg{transform:scale(1)}
.page-banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,rgba(10,14,24,.82) 0%,rgba(10,14,24,.5) 50%,rgba(10,14,24,.10) 100%)}
.pb-in{width:100%;padding:24px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#fff}
.pb-in h2{margin:0 0 6px;font-size:clamp(22px,3.4vw,32px);font-weight:750;letter-spacing:-.6px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.pb-in p{margin:0;font-size:13.5px;color:rgba(255,255,255,.8);max-width:420px;line-height:1.5}
.pb-chip{padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);min-width:130px}
.pb-chip b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px}
.pb-chip span{font-size:11.5px;color:rgba(255,255,255,.75)}
.page-head-end{justify-content:flex-end}
@media (max-width:768px){.pb-in{padding:20px}.page-banner{min-height:200px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:768px){.col-head{display:none}.tenant-row{grid-template-columns:1fr;gap:8px;padding:14px 16px}.search-wrap{width:100%}.statusbar{padding:10px 14px;font-size:11.5px;gap:10px}.statusbar .sep{display:none}.chart-row,.rating-columns{grid-template-columns:1fr}.bank-row{grid-template-columns:90px 1fr 80px}}
@media print{body>*:not(#receiptOverlay){display:none!important}#receiptOverlay{position:static;background:none;opacity:1;padding:0;backdrop-filter:none}#receiptOverlay .modal{box-shadow:none;border:none;max-width:100%;transform:none}.no-print{display:none!important}}

function t(key,params){
  let val=(I18N[currentLang]&&I18N[currentLang][key]!==undefined)?I18N[currentLang][key]:I18N.ru[key];
  if(val===undefined)return key;
  if(typeof val==="string"){
    const p=Object.assign({cur:CURRENCY_BY_LANG[currentLang]},params||{});
    Object.keys(p).forEach(k=>{val=val.split("{"+k+"}").join(p[k])});
  }
  return val;
}

/* ---------- даты (локальные, без сдвига часовых поясов) ---------- */
const pad2=n=>String(n).padStart(2,"0");
function isoOf(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function parseISO(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function todayISO(){return isoOf(new Date())}
function addMonths(iso,n){
  const p=iso.split("-").map(Number);
  const dt=new Date(p[0],p[1]-1+Number(n),1);
  const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  dt.setDate(Math.min(p[2],last));
  return isoOf(dt);
}
function daysBetween(a,b){
  const x=parseISO(a),y=parseISO(b);
  return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/86400000);
}
function fmtDate(iso){if(!iso)return"—";return parseISO(iso).toLocaleDateString(LOCALE_BY_LANG[currentLang]||"ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})}
function fmtMoney(n){return new Intl.NumberFormat(LOCALE_BY_LANG[currentLang]||"ru-RU").format(Math.round(n||0))+" "+(CURRENCY_BY_LANG[currentLang]||"смн")}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function escapeHTML(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- аватары ---------- */
function initials(name){return(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function colorFromString(str){let h=0;for(let i=0;i<str.length;i++)h=str.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h)%360},50%,52%)`}
function avatarHTML(tn,size){
  size=size||36;
  if(tn.photo)return`<img src="${tn.photo}" class="avatar" style="width:${size}px;height:${size}px" alt="">`;
  return`<div class="avatar avatar-fallback" style="width:${size}px;height:${size}px;background:${colorFromString(tn.name||"?")};font-size:${Math.round(size*.38)}px">${escapeHTML(initials(tn.name))}</div>`;
}
function resizeImageFile(file,maxSize){
  maxSize=maxSize||240;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>maxSize){h=h*maxSize/w;w=maxSize}}else{if(h>maxSize){w=w*maxSize/h;h=maxSize}}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",.85));
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

/* ---------- расчёты ---------- */
function computeTenant(tn){
  const history=tn.history||[];
  const paid=history.reduce((s,h)=>s+h.amount,0);
  const paidCash=history.filter(h=>h.method!=="card").reduce((s,h)=>s+h.amount,0);
  const paidCard=history.filter(h=>h.method==="card").reduce((s,h)=>s+h.amount,0);
  const totalDue=tn.price*(tn.months||1);
  const debt=Math.max(0,totalDue-paid);
  const endDate=addMonths(tn.periodStart,tn.months||1);
  const daysLeft=daysBetween(todayISO(),endDate);
  const spent=(tn.expenses||[]).reduce((s,e)=>s+e.amount,0);
  let status="green";
  if(debt>0&&daysLeft<0)status="red";else if(debt>0||daysLeft<=3)status="yellow";
  return{paid,paidCash,paidCard,totalDue,debt,endDate,daysLeft,spent,remaining:paid-spent,status};
}
function statusBadge(info){
  if(info.status==="red")return{cls:"badge-red",text:t("badgeOverdue",{n:Math.abs(info.daysLeft)})};
  if(info.status==="yellow")return{cls:"badge-yellow",text:info.debt>0?t("badgeDebt"):t("badgeExpiring",{n:info.daysLeft})};
  return{cls:"badge-green",text:t("badgePaid")};
}

/* ---------- рейтинг ---------- */
function computeRatingScore(tn){
  const info=computeTenant(tn);
  if(info.debt<=0)return{good:true,score:100000+Math.max(0,info.daysLeft),info,overdueDays:0};
  const overdueDays=info.daysLeft<0?Math.abs(info.daysLeft):0;
  return{good:false,score:-(info.debt+overdueDays*500),info,overdueDays};
}
function rankBadge(i){return i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1)}
function ratingItem(x,i,color,metric){
  return`<div class="rating-item" onclick="openDetail('${x.tn.id}')"><div class="rating-rank">${rankBadge(i)}</div>${avatarHTML(x.tn,38)}<div class="rating-info"><b>${escapeHTML(x.tn.name)}</b><div class="rating-room">${t("roomHeaderLabel",{room:escapeHTML(x.tn.room)})}</div></div><div class="rating-metric" style="color:var(--${color})">${metric}</div></div>`;
}
function renderRating(){
  const scored=tenants.map(tn=>({tn,...computeRatingScore(tn)}));
  const best=scored.filter(x=>x.good).sort((a,b)=>b.score-a.score);
  const worst=scored.filter(x=>!x.good).sort((a,b)=>a.score-b.score);
  document.getElementById("ratingBestList").innerHTML=best.length?best.map((x,i)=>ratingItem(x,i,"green",t("ratingMetricBest",{n:Math.max(0,x.info.daysLeft)}))).join(""):`<div class="empty-state">${t("ratingEmptyBest")}</div>`;
  document.getElementById("ratingWorstList").innerHTML=worst.length?worst.map((x,i)=>ratingItem(x,i,"red",x.overdueDays>0?t("ratingMetricWorstOverdue",{n:x.overdueDays,amount:fmtMoney(x.info.debt)}):t("ratingMetricWorstDebt",{amount:fmtMoney(x.info.debt)}))).join(""):`<div class="empty-state">${t("ratingEmptyWorst")}</div>`;
}

function remindTenant(id){
  const tn=tenants.find(x=>x.id===id);if(!tn)return;
  const digits=(tn.phone||"").replace(/\D/g,"");
  if(!digits){showToast(t("remindNoPhone"));return}
  const info=computeTenant(tn);
  const msg=t("remindMsg",{name:tn.name,room:tn.room,amount:fmtMoney(info.debt),date:fmtDate(info.endDate)});
  window.open("https://wa.me/"+digits+"?text="+encodeURIComponent(msg),"_blank","noopener");
}
function renderNotifications(){
  const wrap=document.getElementById("notifBanner");
  const urgent=tenants.map(tn=>({tn,info:computeTenant(tn)})).filter(x=>x.info.status==="red"||(x.info.daysLeft>=0&&x.info.daysLeft<=3)).sort((a,b)=>a.info.daysLeft-b.info.daysLeft);
  if(!urgent.length){wrap.style.display="none";wrap.innerHTML="";return}
  wrap.style.display="block";
  const expanded=wrap.dataset.expanded==="1";
  const items=urgent.map(({tn,info})=>{
    const overdue=info.daysLeft<0;
    const label=overdue?t("notifOverdueDays",{n:Math.abs(info.daysLeft)}):(info.daysLeft===0?t("notifExpiresToday"):t("notifDaysLeft",{n:info.daysLeft}));

  }).join("");
  wrap.innerHTML=`<div class="notif-header" onclick="toggleNotif()"><div style="display:flex;align-items:center;gap:8px"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span><b>${urgent.length}</b> ${urgent.length===1?t("notifSingular"):t("notifPlural")}</span></div><span class="notif-toggle">${expanded?t("notifCollapse"):t("notifExpand")}</span></div>${expanded?`<div class="notif-list">${items}</div>`:""}`;

/* ---------- аналитика ---------- */
function lastNMonths(n){
  const arr=[],now=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);arr.push(d.getFullYear()+"-"+pad2(d.getMonth()+1))}
  return arr;
}
function monthLabel(key){return t("monthNames")[Number(key.split("-")[1])-1]}
function renderAnalytics(){
  let capTotal=0,occ=0;
  rooms.filter(r=>r.capacity>0).forEach(r=>{capTotal+=r.capacity;occ+=tenants.filter(tn=>tn.room===r.number).length});
  document.getElementById("kpiOccupancy").textContent=capTotal>0?Math.round(occ/capTotal*100)+"%":"—";
  document.getElementById("kpiFree").textContent=capTotal>0?Math.max(0,capTotal-occ):"—";
  const cm=todayISO().slice(0,7);
  document.getElementById("kpiRevenue").textContent=fmtMoney(cashOps.filter(o=>o.type==="income"&&o.date&&o.date.slice(0,7)===cm).reduce((s,o)=>s+o.amount,0));
  document.getElementById("kpiDebt").textContent=fmtMoney(lastStats.debt);
  renderBarChart();renderDonut();renderBankChart();
}
function renderBarChart(){
  const months=lastNMonths(6);
  const sum=(type,mk)=>cashOps.filter(o=>o.type===type&&o.date&&o.date.slice(0,7)===mk).reduce((s,o)=>s+o.amount,0);
  const inc=months.map(m=>sum("income",m)),exp=months.map(m=>sum("expense",m));
  const wrap=document.getElementById("barChartWrap");
  if(inc.every(v=>v===0)&&exp.every(v=>v===0)){wrap.innerHTML=`<div class="chart-empty">${t("chartEmpty")}</div>`;return}
  const max=Math.max(1,...inc,...exp),W=560,H=200,padB=26,padT=10,gw=W/months.length,bw=18;
  let bars="";
  months.forEach((mk,i)=>{
    const cx=i*gw+gw/2,hi=inc[i]/max*(H-padB-padT),he=exp[i]/max*(H-padB-padT);
    bars+=`<rect x="${cx-bw-2}" y="${H-padB-hi}" width="${bw}" height="${hi}" rx="3" style="fill:var(--accent)"/><rect x="${cx+2}" y="${H-padB-he}" width="${bw}" height="${he}" rx="3" style="fill:var(--red)"/><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--ink-faint)">${monthLabel(mk)}</text>`;
  });
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" style="stroke:var(--line)"/>${bars}</svg>`;
}
function renderDonut(){
  const data=[{label:t("statusRisk"),value:lastStats.red,color:"var(--red)"},{label:t("statusAttention"),value:lastStats.yellow,color:"var(--yellow)"},{label:t("statusNormal"),value:lastStats.green,color:"var(--green)"}];
  const total=data.reduce((s,d)=>s+d.value,0),r=70,cx=90,cy=90,C=2*Math.PI*r;
  let off=0,segs="";
  if(!total)segs=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="22"/>`;
  else data.forEach(d=>{if(d.value<=0)return;const len=d.value/total*C;segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${d.color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len});
  const legend=data.map(d=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin-top:6px"><i style="width:9px;height:9px;border-radius:50%;background:${d.color};display:inline-block"></i>${d.label}: <b style="color:var(--ink)">${d.value}</b></div>`).join("");
  document.getElementById("donutChartWrap").innerHTML=`<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:140px;height:140px;flex-shrink:0">${segs}<text x="90" y="85" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--ink)">${total}</text><text x="90" y="103" text-anchor="middle" font-size="11" style="fill:var(--ink-soft)">${t("donutPeopleLabel")}</text></svg><div>${legend}</div></div>`;
}
function renderBankChart(){
  const totals={cash:0,cardOther:0};BANKS.forEach(b=>totals[b.id]=0);
  tenants.forEach(tn=>(tn.history||[]).forEach(h=>{
    if(h.method==="card"){if(h.bank&&totals[h.bank]!==undefined)totals[h.bank]+=h.amount;else totals.cardOther+=h.amount}
    else totals.cash+=h.amount;
  }));
  const rowsData=[{key:"cash",label:t("optCash"),cls:"cash"},...BANKS.map(b=>({key:b.id,label:b.name,cls:""})),{key:"cardOther",label:t("noBank"),cls:""}].filter(r=>totals[r.key]>0);
  const wrap=document.getElementById("bankChartWrap");
  if(!rowsData.length){wrap.innerHTML=`<div class="chart-empty">${t("chartEmpty")}</div>`;return}
  const max=Math.max(...rowsData.map(r=>totals[r.key]));
  wrap.innerHTML=rowsData.map(r=>`<div class="bank-row"><span>${escapeHTML(r.label)}</span><div class="bank-bar"><i class="${r.cls}" style="width:${totals[r.key]/max*100}%"></i></div><b style="text-align:right">${fmtMoney(totals[r.key])}</b></div>`).join("");
}

const tenantOverlay=document.getElementById("tenantOverlay");
document.getElementById("openAddTenantBtn").onclick=()=>openAddTenantModal(null);
function openAddTenantModal(id){
  editingTenantId=id||null;

function closeTenantModal(){tenantOverlay.classList.remove("open");editingTenantId=null}
document.getElementById("submitAddBtn").onclick=()=>{
  const name=document.getElementById("fName").value.trim(),room=document.getElementById("fRoom").value.trim();
  const price=Number(document.getElementById("fPrice").value),months=Math.max(1,Math.round(Number(document.getElementById("fMonths").value))||1);
  const start=document.getElementById("fStart").value,phone=document.getElementById("fPhone").value.trim(),notes=document.getElementById("fNotes").value.trim();

    const tn=tenants.find(x=>x.id===editingTenantId);

    saveData();closeTenantModal();render();showToast(t("toastTenantUpdated"));
  }else{
    const paidNow=Number(document.getElementById("fPaidNow").value)||0;
    const method=document.getElementById("fPaidMethod").value;
    const bank=method==="card"?document.getElementById("fBank").value:"";
    const payId=genId();

    if(paidNow>0)cashOps.unshift({id:genId(),payId,type:"income",amount:paidNow,note:t("cashNotePayment",{name,room}),date:start,method,bank});

/* ---------- оплата ---------- */
const payOverlay=document.getElementById("payOverlay");
function openPayModal(tenantId,entryId){
  const tn=tenants.find(x=>x.id===tenantId);if(!tn)return;
  document.getElementById("payTenantId").value=tenantId;
  if(entryId){
    const en=(tn.history||[]).find(h=>h.id===entryId);if(!en)return;
    editingPaymentEntry={tenantId,entryId};
    document.getElementById("payAmount").value=en.amount;document.getElementById("payDate").value=en.date;
    document.getElementById("payMethod").value=en.method||"cash";
    document.getElementById("payBank").value=en.bank||BANKS[0].id;
  }else{
    editingPaymentEntry=null;
    const info=computeTenant(tn);
    document.getElementById("payAmount").value=info.debt>0?info.debt:tn.price;
    document.getElementById("payDate").value=todayISO();
    document.getElementById("payMethod").value="cash";document.getElementById("payBank").selectedIndex=0;
  }
  toggleBank("payMethod","payBankWrap");
  document.getElementById("payModalSub").textContent=t("payModalSubTenant",{name:tn.name,room:tn.room});
  applyStaticTranslations();
  payOverlay.classList.add("open");
}
function closePayModal(){payOverlay.classList.remove("open");editingPaymentEntry=null}
function submitPayment(){
  const tenantId=document.getElementById("payTenantId").value;
  const amount=Number(document.getElementById("payAmount").value);
  const date=document.getElementById("payDate").value||todayISO();
  const method=document.getElementById("payMethod").value;
  const bank=method==="card"?document.getElementById("payBank").value:"";
  const tn=tenants.find(x=>x.id===tenantId);
  if(!tn||!(amount>0))return;
  if(editingPaymentEntry){
    const en=(tn.history||[]).find(h=>h.id===editingPaymentEntry.entryId);
    if(en){
      Object.assign(en,{amount,date,method,bank});
      const op=cashOps.find(o=>o.payId===en.id);
      if(op)Object.assign(op,{amount,date,method,bank});
    }
    showToast(t("toastPaymentChanged"));
  }else{
    tn.history=tn.history||[];
    const payId=genId();
    tn.history.push({id:payId,date,amount,method,bank});
    cashOps.unshift({id:genId(),payId,type:"income",amount,note:t("cashNotePayment",{name:tn.name,room:tn.room}),date,method,bank});
    showToast(t("toastPaymentAccepted"));
  }
  saveData();closePayModal();render();
}
function deletePayment(tenantId,entryId){
  if(!confirm(t("confirmDeletePayment")))return;
  const tn=tenants.find(x=>x.id===tenantId);if(!tn)return;
  tn.history=(tn.history||[]).filter(h=>h.id!==entryId);
  cashOps=cashOps.filter(o=>o.payId!==entryId);
  saveData();render();
}

  }else{
    editingExpenseEntry=null;
    document.getElementById("expAmount").value="";document.getElementById("expDate").value=todayISO();document.getElementById("expNote").value="";
  }
  document.getElementById("expModalSub").textContent=t("expModalSub",{name:tn.name});
  applyStaticTranslations();
  expenseOverlay.classList.add("open");
}
function closeExpenseModal(){expenseOverlay.classList.remove("open");editingExpenseEntry=null}
function submitExpense(){
  const tenantId=document.getElementById("expTenantId").value;
  const amount=Number(document.getElementById("expAmount").value);
  const date=document.getElementById("expDate").value||todayISO();
  const note=document.getElementById("expNote").value.trim();
  const tn=tenants.find(x=>x.id===tenantId);
  if(!tn||!(amount>0))return;
  tn.expenses=tn.expenses||[];
  if(editingExpenseEntry){
    const e=tn.expenses.find(x=>x.id===editingExpenseEntry.expenseId);
    if(e)Object.assign(e,{amount,date,note});
    showToast(t("toastExpenseChanged"));
  }else{
    tn.expenses.push({id:genId(),date,amount,note});
    showToast(t("toastExpenseAdded"));
  }
  saveData();closeExpenseModal();render();
}
function deleteExpense(tenantId,expenseId){
  if(!confirm(t("confirmDeleteExpense")))return;
  const tn=tenants.find(x=>x.id===tenantId);if(!tn)return;
  tn.expenses=(tn.expenses||[]).filter(x=>x.id!==expenseId);saveData();render();
}

/* ---------- карточка жильца ---------- */
function openDetail(id){currentDetailId=id;renderTenantDetail(id);document.getElementById("detailOverlay").classList.add("open")}
function closeDetailModal(){document.getElementById("detailOverlay").classList.remove("open");currentDetailId=null}
function renderTenantDetail(id){
  const tn=tenants.find(x=>x.id===id);
  if(!tn){closeDetailModal();return}
  const info=computeTenant(tn),b=statusBadge(info);

  const history=(tn.history||[]).slice().sort((a,c)=>c.date.localeCompare(a.date)).map(h=>`<div class="ledger-row"><div class="lr-main"><b style="color:var(--green)">+${fmtMoney(h.amount)}</b>${methodBadge(h)}</div><div class="lr-side"><span class="lr-date">${fmtDate(h.date)}</span><button class="action-btn" onclick="openReceipt('${tn.id}','${h.id}')" title="${t("btnReceipt")}">🧾</button><button class="action-btn" onclick="openPayModal('${tn.id}','${h.id}')" title="${t("titleEdit")}">✎</button><button class="action-btn danger" onclick="deletePayment('${tn.id}','${h.id}')" title="${t("titleDelete")}">✕</button></div></div>`).join("")||`<div class="ledger-empty">${t("ledgerEmptyPayments")}</div>`;

  const expenses=(tn.expenses||[]).slice().sort((a,c)=>c.date.localeCompare(a.date)).map(e=>`<div class="ledger-row"><div class="lr-main"><b style="color:var(--red)">-${fmtMoney(e.amount)}</b><span>${escapeHTML(e.note)||t("cashDefaultNote")}</span></div><div class="lr-side"><span class="lr-date">${fmtDate(e.date)}</span><button class="action-btn" onclick="openExpenseModal('${tn.id}','${e.id}')" title="${t("titleEdit")}">✎</button><button class="action-btn danger" onclick="deleteExpense('${tn.id}','${e.id}')" title="${t("titleDelete")}">✕</button></div></div>`).join("")||`<div class="ledger-empty">${t("ledgerEmptyExpenses")}</div>`;

  // разбивка карт по банкам
  const byBank={};
  (tn.history||[]).filter(h=>h.method==="card").forEach(h=>{const k=bankName(h.bank)||t("noBank");byBank[k]=(byBank[k]||0)+h.amount});
  const bankRows=Object.keys(byBank).map(k=>`<div class="fin-row sub"><span>— ${escapeHTML(k)}</span><span>${fmtMoney(byBank[k])}</span></div>`).join("");

  document.getElementById("detailBody").innerHTML=`
    <div class="detail-head">${avatarHTML(tn,64)}<div class="detail-head-info"><h3>${escapeHTML(tn.name)}</h3>
      <div class="detail-head-sub">${t("roomHeaderLabel",{room:escapeHTML(tn.room)})} · ${t("detailMovedIn",{date:fmtDate(tn.periodStart)})}</div>
      ${tn.phone?`<a href="tel:${escapeHTML(tn.phone)}" class="detail-phone">${escapeHTML(tn.phone)}</a>`:""}</div>
      <span class="badge ${b.cls}">${b.text}</span></div>
    ${tn.notes?`<p class="detail-notes">${escapeHTML(tn.notes)}</p>`:""}
    <div class="detail-stats-grid">
      <div class="dstat"><div class="l">${t("detailTariff")}</div><div class="v">${fmtMoney(tn.price)}${t("detailPerMonth")}</div></div>
      <div class="dstat"><div class="l">${t("detailTerm")}</div><div class="v">${tn.months} ${t("detailMonthsUnit")}</div></div>
      <div class="dstat"><div class="l">${t("detailEndDate")}</div><div class="v">${fmtDate(info.endDate)}</div></div>
      <div class="dstat"><div class="l">${t("detailRentDebt")}</div><div class="v" style="color:${info.debt>0?"var(--red)":"inherit"}">${fmtMoney(info.debt)}</div></div>
    </div>
    <div class="quick-actions">
      <button class="btn-secondary" onclick="extendTenant('${tn.id}')">⏩ ${t("btnExtend")}</button>
      ${info.debt>0?`<button class="btn-secondary" onclick="remindTenant('${tn.id}')">💬 ${t("btnRemind")}</button>`:""}
    </div>
    <div class="detail-finance">
      <div class="fin-row"><span>${t("detailTotalIncome")}</span><b>${fmtMoney(info.paid)}</b></div>
      <div class="fin-row sub"><span>${t("detailCashSub")}</span><span>${fmtMoney(info.paidCash)}</span></div>
      <div class="fin-row sub"><span>${t("detailCardSub")}</span><span>${fmtMoney(info.paidCard)}</span></div>
      ${bankRows}
      <div class="fin-row"><span>${t("detailSpent")}</span><b style="color:var(--red)">${fmtMoney(info.spent)}</b></div>
      <div class="fin-row total"><span>${t("detailRemaining")}</span><b>${fmtMoney(info.remaining)}</b></div>
    </div>
    <div class="detail-section"><div class="detail-section-head"><h4>${t("detailHistoryTitle")}</h4><button class="btn-primary small" onclick="openPayModal('${tn.id}')">${t("btnAddPayment")}</button></div><div class="ledger-list">${history}</div></div>
    <div class="detail-section"><div class="detail-section-head"><h4>${t("detailExpensesTitle")}</h4><button class="btn-primary small" onclick="openExpenseModal('${tn.id}')">${t("btnAddExpense")}</button></div><div class="ledger-list">${expenses}</div></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeDetailModal();openAddTenantModal('${tn.id}')">${t("btnEditTenantData")}</button>
      <button class="btn-secondary" style="color:var(--red);border-color:var(--red)" onclick="deleteTenant('${tn.id}',true)">${t("btnDeleteTenant")}</button>
    </div>`;
}

/* ---------- касса: модалка ---------- */
const cashOverlay=document.getElementById("cashOverlay");
function openCashModal(id){
  editingCashId=id||null;
  const op=editingCashId?cashOps.find(x=>x.id===editingCashId):null;
  document.getElementById("cType").value=op?op.type:"income";
  document.getElementById("cAmount").value=op?op.amount:"";
  document.getElementById("cNote").value=op?(op.note||""):"";
  document.getElementById("cPerson").value=op?(op.person||""):"";
  applyStaticTranslations();
  cashOverlay.classList.add("open");
}
function closeCashModal(){cashOverlay.classList.remove("open");editingCashId=null}
document.getElementById("submitCashBtn").onclick=()=>{
  const type=document.getElementById("cType").value,amount=Number(document.getElementById("cAmount").value);
  const note=document.getElementById("cNote").value.trim(),person=document.getElementById("cPerson").value.trim();
  if(!(amount>0))return;
  if(editingCashId){
    const op=cashOps.find(x=>x.id===editingCashId);
    if(op)Object.assign(op,{type,amount,note,person});
    showToast(t("toastOpChanged"));
  }else{
    cashOps.unshift({id:genId(),type,amount,note,person,date:todayISO()});
    showToast(t("toastOpAdded"));
  }
  saveData();closeCashModal();render();
};
function deleteCash(id){
  if(!confirm(t("confirmDeleteCash")))return;
  cashOps=cashOps.filter(c=>c.id!==id);saveData();render();
}

/* ---------- контакты: модалка ---------- */
const personOverlay=document.getElementById("personOverlay");
function openPersonModal(id){
  editingPersonId=id||null;
  const p=editingPersonId?people.find(x=>x.id===editingPersonId):null;
  document.getElementById("pName").value=p?p.name:"";
  applyStaticTranslations();
  personOverlay.classList.add("open");
}
function closePersonModal(){personOverlay.classList.remove("open");editingPersonId=null}
document.getElementById("submitPersonBtn").onclick=()=>{
  const name=document.getElementById("pName").value.trim();
  if(!name)return;
  if(editingPersonId){const p=people.find(x=>x.id===editingPersonId);if(p)p.name=name;showToast(t("toastContactChanged"))}
  else{people.push({id:genId(),name});showToast(t("toastContactAdded"))}
  saveData();closePersonModal();render();
};
function deletePerson(id){
  if(!confirm(t("confirmDeletePerson")))return;
  people=people.filter(p=>p.id!==id);saveData();render();
}

/* ---------- закрытие окон ---------- */
document.querySelectorAll(".overlay").forEach(ov=>{
  ov.addEventListener("click",e=>{
    if(e.target!==ov)return;
    ov.classList.remove("open");
    if(ov.id==="detailOverlay")currentDetailId=null;
  });
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){document.querySelectorAll(".overlay.open").forEach(ov=>ov.classList.remove("open"));currentDetailId=null}
});

/* ---------- экспорт / импорт ---------- */
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportData(){
  downloadBlob(new Blob([JSON.stringify({tenants,cashOps,people,rooms})],{type:"application/json"}),`obshaga_backup_${todayISO()}.json`);
  showToast(t("toastBackupSaved"));
}
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data||!Array.isArray(data.tenants))throw new Error("bad format");
      if(!confirm(t("confirmImport")))return;
      tenants=data.tenants;cashOps=Array.isArray(data.cashOps)?data.cashOps:[];people=Array.isArray(data.people)?data.people:[];rooms=Array.isArray(data.rooms)?data.rooms:[];
      saveData();render();showToast(t("toastImportSuccess"));
    }catch(err){showToast(t("toastImportError"))}
    finally{e.target.value=""}
  };
  reader.readAsText(file);
});
function exportCSV(){
  const headers=t("csvHeaders").concat([t("fieldBank")]);
  const rows=[headers];
  tenants.forEach(tn=>{
    const info=computeTenant(tn);
    const banks=[...new Set((tn.history||[]).filter(h=>h.method==="card").map(h=>bankName(h.bank)||t("noBank")))].join("; ");
    rows.push([tn.room,tn.name,tn.price,tn.periodStart,tn.months,info.paid,info.paidCash,info.paidCard,info.debt,info.spent,info.endDate,tn.phone||"",banks]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}),`obshaga_tenants_${todayISO()}.csv`);
  showToast(t("toastCsvSaved"));
}

/* ---------- запуск ---------- */
fillBankSelects();
applyStaticTranslations();
render();
switchTab((location.hash||"").slice(1)||"home",true);
</script>
</body>
